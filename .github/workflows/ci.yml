name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Verify vendor is in sync
        run: |
          go mod tidy
          go mod vendor
          if ! git diff --exit-code go.mod go.sum vendor/; then
            echo "::error::go.mod / go.sum / vendor/ out of sync. Run 'make tidy' locally and commit."
            exit 1
          fi

      - name: Verify swagger is in sync
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/api/main.go -o docs/swagger --parseDependency
          if ! git diff --exit-code docs/swagger/; then
            echo "::error::docs/swagger/ out of sync. Run 'make swagger' locally and commit."
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
        env:
          GOFLAGS: -mod=vendor

      - name: Install Playwright browsers and OS deps
        run: go run -mod=vendor github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium

      - name: Test (unit + integration + e2e)
        run: make test-all

      - name: Build
        run: go build -mod=vendor -o /dev/null ./cmd/api
