services:
  postgres:
    ports:
      - "5432:5432"
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  notifications-svc:
    build:
      context: .
      dockerfile: Dockerfile.notifications-svc
    ports:
      - "8081:8081"
    environment:
      NOTIFICATIONS_HTTP_ADDR: ":8081"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_POLICY: none
      SMTP_FROM: noreply@reposeetory.local
      LOG_PRETTY: "true"
      LOG_LEVEL: info
    depends_on:
      mailpit:
        condition: service_started

  migrate:
    image: migrate/migrate:latest
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://postgres:pass@postgres:5432/postgres?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:pass@postgres:5432/postgres?sslmode=disable
      APP_BASE_URL: http://localhost:8080
      NOTIFICATIONS_URL: http://notifications-svc:8081
      REDIS_URL: redis://redis:6379
      LOG_PRETTY: "true"
      LOG_LEVEL: info
    env_file:
      - path: .env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      notifications-svc:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pgdata:
