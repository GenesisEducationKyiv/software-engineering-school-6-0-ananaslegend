# Load-test stack — do NOT use in production.
# Ports are offset from dev defaults (postgres +1, redis +1, github-stub :8090)
# so this stack can run alongside the dev `docker-compose.yml`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
      POSTGRES_DB: loadtest
    tmpfs:
      - /var/lib/postgresql/data
    # WARNING: fsync=off + synchronous_commit=off disable crash safety.
    # Load-test only — copying to a prod compose would risk data loss.
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=100
        -c fsync=off
        -c synchronous_commit=off
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadtest"]
      interval: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    tmpfs:
      - /data
    ports: ["6380:6379"]

  github-stub:
    build:
      context: .
      dockerfile: tests/load/githubstub/Dockerfile
    environment:
      STUB_REPOS: "1000"
      STUB_LATENCY_MS: "20"
      STUB_PORT: "8090"
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://loadtest:loadtest@postgres:5432/loadtest?sslmode=disable
      REDIS_URL: redis://redis:6379
      GITHUB_GRAPHQL_URL: http://github-stub:8090/graphql
      GITHUB_REST_URL: http://github-stub:8090
      GITHUB_TOKEN: loadtest
      RESEND_API_KEY: ""
      MAILER_DRIVER: noop
      LOG_LEVEL: warn
      SCANNER_INTERVAL: 500ms
      NOTIFIER_INTERVAL: 200ms
      CONFIRMER_INTERVAL: 200ms
      DB_MAX_CONNS: "20"
      APP_BASE_URL: http://localhost:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      github-stub: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 3s
      retries: 20
      start_period: 5s

  k6:
    image: grafana/k6:0.50.0
    volumes:
      - ./tests/load/k6:/scripts:ro
      - ./tests/load/results:/results
    environment:
      BASE_URL: http://app:8080
    network_mode: "service:app"
    profiles: ["k6"]
