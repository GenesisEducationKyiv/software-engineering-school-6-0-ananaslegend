global:
  scrape_interval: 15s
  external_labels:
    service: reposeetory
    env: ${ENV:-development}

scrape_configs:
  - job_name: reposeetory
    metrics_path: /metrics
    static_configs:
      - targets:
          - ${APP_METRICS_TARGET:-api:8080}
        labels:
          instance: reposeetory-api
